name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fast_api/requirements.txt

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Tests
        # Valeurs factices : les tests n'appellent ni Supabase ni Groq.
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          GROQ_API_KEY: test
        run: python -m pytest -q

  catalogue:
    name: Catalogue d'outils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Bloque la fusion si une fiche référence une variable non déclarée : le
      # promptTemplate étant désormais exécuté, elle fuiterait dans le prompt.
      - name: Validation des fiches d'outils
        run: npx tsx scripts/validate_tools.ts --quiet

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
